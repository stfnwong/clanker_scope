[project]
name = "clanker-scope"
version = "0.1.0"
description = "Measure your clanker"
readme = "README.md"
authors = [
    { name = "Stefan Wong", email = "stfnwong@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mermaidx>=0.9.5",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pudb>=2025.1.5",
    "pytest>=9.1.1",
]
